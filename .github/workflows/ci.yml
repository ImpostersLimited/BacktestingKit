name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    name: Xcode ${{ matrix.xcode }} (${{ matrix.configuration }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        xcode: [default, "27.1"]
        include:
          - xcode: default
            runner: macos-latest
          - xcode: "27.1"
            runner: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select stable Xcode 27.1
        if: matrix.xcode == '27.1'
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer

      - name: Show Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: >-
          swift build -c ${{ matrix.configuration }}
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Test
        run: >-
          swift test -c ${{ matrix.configuration }}
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Run parity (if local JS engine is available)
        if: matrix.configuration == 'debug' && matrix.xcode == 'default'
        shell: bash
        run: |
          if [[ -f ../js-engine/algotrade3/models/src/ATTechnicalIndicators.ts || -f ../algotrade-js-trial/algotrade3/models/src/ATTechnicalIndicators.ts || -f js-engine/algotrade3/models/src/ATTechnicalIndicators.ts ]]; then
            bash tools/parity/run_parity.sh
          else
            echo "Skipping parity: local JS engine checkout not found."
          fi
